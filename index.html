    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Benua Brutti Sdn Bhd",
        "alternateName": ["Brutti", "Brutti™"],
        "url": "https://brutti.my/",
        "logo": "https://brutti.my/assets/logo%20brutti.jpg",
        "telephone": "+601136043432",
        "description": "Upcycled pallet wood furniture, custom pieces and functional spaces crafted in Sabah, Malaysia.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Kilang 5, Taman Industri Perabot, Kota Kinabalu Industrial Park (KKIP)",
          "addressLocality": "Kota Kinabalu",
          "addressRegion": "Sabah",
          "postalCode": "88450",
          "addressCountry": "MY"
        },
        "sameAs": [
          "https://www.instagram.com/brutti.my",
          "https://www.facebook.com/share/1EfVN5HMJm/",
          "https://www.tiktok.com/@brutti.my",
          "https://www.threads.com/@brutti.my"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <link rel="stylesheet" href="/src/footer-compact.css" />
    <link rel="stylesheet" href="/src/footer-social-fix.css" />
    <script>
      (() => {
        const root = document.getElementById('root')
        if (!root) return

        const cleanCopy = (value) => value
          .replace(/\s*[—–]\s*/g, ', ')
          .replace(/([A-Za-z])[-‑]([A-Za-z])/g, '$1 $2')
          .replace(/\s{2,}/g, ' ')

        const applyWhatsAppContact = () => {
          const link = document.querySelector('.contact__phone')
          if (!link || link.dataset.whatsappApplied === 'true') return

          const message = encodeURIComponent('Hi! I’m interested in your products and would like to know more.')
          link.href = `https://wa.me/601136043432?text=${message}`
          link.target = '_blank'
          link.rel = 'noreferrer'
          link.setAttribute('aria-label', 'Chat with Benua Brutti on WhatsApp')
          link.setAttribute('title', 'Chat on WhatsApp')
          link.dataset.whatsappApplied = 'true'
          link.innerHTML = `
            <svg aria-hidden="true" viewBox="0 0 32 32" width="19" height="19" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill="currentColor" fill-rule="evenodd" d="M16 3.2c-7.06 0-12.8 5.58-12.8 12.45 0 2.19.59 4.33 1.71 6.2L3.2 28.8l7.16-1.82A13.1 13.1 0 0 0 16 28.1c7.06 0 12.8-5.58 12.8-12.45S23.06 3.2 16 3.2Zm0 22.8c-1.9 0-3.76-.5-5.37-1.45l-.39-.23-4.25 1.08 1.13-4.04-.26-.4a10.14 10.14 0 0 1-1.56-5.31C5.3 9.94 10.1 5.3 16 5.3s10.7 4.64 10.7 10.35S21.9 26 16 26Zm5.87-7.72c-.32-.16-1.9-.91-2.2-1.01-.29-.1-.5-.16-.71.16-.21.31-.82 1.01-1 1.22-.18.21-.37.24-.69.08-.32-.16-1.35-.48-2.57-1.54-.95-.82-1.59-1.84-1.78-2.15-.18-.31-.02-.48.14-.63.14-.14.32-.36.48-.54.16-.18.21-.31.32-.52.11-.21.05-.39-.03-.55-.08-.16-.71-1.67-.98-2.29-.26-.62-.52-.53-.71-.54h-.61c-.21 0-.55.08-.84.39-.29.31-1.11 1.06-1.11 2.58s1.14 2.99 1.3 3.2c.16.21 2.24 3.33 5.43 4.67.76.32 1.35.51 1.81.65.76.23 1.45.2 2 .12.61-.09 1.9-.75 2.17-1.48.27-.73.27-1.35.19-1.48-.08-.13-.29-.21-.61-.37Z" clip-rule="evenodd"/>
            </svg>
            <span>+60 11-3604 3432</span>
          `
        }

        const cleanTextNodes = (node) => {
          if (!node) return

          if (node.nodeType === Node.TEXT_NODE) {
            const parent = node.parentElement
            if (!parent || ['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEXTAREA'].includes(parent.tagName)) return
            const nextValue = cleanCopy(node.nodeValue || '')
            if (nextValue !== node.nodeValue) node.nodeValue = nextValue
            return
          }

          if (node.nodeType !== Node.ELEMENT_NODE) return
          if (['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEXTAREA'].includes(node.tagName)) return

          const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT)
          let textNode = walker.nextNode()
          while (textNode) {
            const parent = textNode.parentElement
            if (parent && !['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEXTAREA'].includes(parent.tagName)) {
              const nextValue = cleanCopy(textNode.nodeValue || '')
              if (nextValue !== textNode.nodeValue) textNode.nodeValue = nextValue
            }
            textNode = walker.nextNode()
          }
        }

        cleanTextNodes(root)
        applyWhatsAppContact()

        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach(cleanTextNodes)
          })
          applyWhatsAppContact()
        })

        observer.observe(root, { childList: true, subtree: true })
      })()
    </script>
  </body>
</html>
