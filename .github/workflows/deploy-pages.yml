name: Deploy Benua Brutti website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Brutti web images
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter, ImageEnhance
          from pillow_heif import register_heif_opener

          register_heif_opener()
          assets = Path('public/assets')

          def save_web_preview(source, output, max_size=(1000, 1000), quality=84):
              image = Image.open(source)
              image = ImageOps.exif_transpose(image).convert('RGB')
              image.thumbnail(max_size, Image.Resampling.LANCZOS)
              image.save(output, quality=quality, optimize=True, progressive=True)

          team = Image.open(assets / 'brutti team.jpg')
          team = ImageOps.exif_transpose(team).convert('RGB')

          canvas_w, canvas_h = 2800, 1200
          bg = ImageOps.fit(
              team,
              (canvas_w, canvas_h),
              method=Image.Resampling.LANCZOS,
              centering=(0.50, 0.42),
          )
          bg = bg.filter(ImageFilter.GaussianBlur(24))
          bg = ImageEnhance.Color(bg).enhance(0.62)
          bg = ImageEnhance.Contrast(bg).enhance(0.88)
          bg = ImageEnhance.Brightness(bg).enhance(0.42).convert('RGBA')

          foreground = ImageEnhance.Contrast(team).enhance(1.02)
          foreground = ImageEnhance.Color(foreground).enhance(1.02)
          target_h = 1040
          scale = target_h / foreground.height
          fg_w = max(1, int(foreground.width * scale))
          fg_h = max(1, int(foreground.height * scale))
          foreground = foreground.resize((fg_w, fg_h), Image.Resampling.LANCZOS).convert('RGBA')

          fade_width = min(320, max(180, fg_w // 3))
          alpha = Image.new('L', (fg_w, fg_h), 255)
          alpha_px = alpha.load()
          for px in range(fade_width):
              t = px / max(1, fade_width - 1)
              value = int(255 * (t * t * (3 - 2 * t)))
              for py in range(fg_h):
                  alpha_px[px, py] = value
          foreground.putalpha(alpha)

          x = canvas_w - fg_w - 72
          y = 120
          bg.alpha_composite(foreground, (x, y))

          gradient = Image.new('L', (canvas_w, 1), 0)
          grad_px = gradient.load()
          fade_end = int(canvas_w * 0.61)
          for px in range(canvas_w):
              if px <= fade_end:
                  t = px / max(1, fade_end)
                  grad_px[px, 0] = int(225 * ((1 - t) ** 1.35))
              else:
                  grad_px[px, 0] = 0
          gradient = gradient.resize((canvas_w, canvas_h))
          overlay = Image.new('RGBA', (canvas_w, canvas_h), (5, 35, 24, 0))
          overlay.putalpha(gradient)
          bg = Image.alpha_composite(bg, overlay)

          vignette = Image.new('L', (1, canvas_h), 0)
          vg = vignette.load()
          edge = 150
          for py in range(canvas_h):
              if py < edge:
                  vg[0, py] = int(28 * (1 - py / edge))
              elif py > canvas_h - edge:
                  vg[0, py] = int(22 * ((py - (canvas_h - edge)) / edge))
          vmask = vignette.resize((canvas_w, canvas_h))
          vlayer = Image.new('RGBA', (canvas_w, canvas_h), (0, 0, 0, 0))
          vlayer.putalpha(vmask)
          bg = Image.alpha_composite(bg, vlayer)

          bg.convert('RGB').save(assets / 'brutti-team-landscape.jpg', quality=88, optimize=True, progressive=True)

          full_team = team.copy()
          full_team.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
          full_team.save(assets / 'brutti-team-full.jpg', quality=88, optimize=True, progressive=True)

          founders = Image.open(assets / 'founder & co founder.JPG')
          founders = ImageOps.exif_transpose(founders).convert('RGB')
          founders.thumbnail((1400, 1400), Image.Resampling.LANCZOS)
          founders.save(assets / 'founders.jpg', quality=84, optimize=True, progressive=True)

          preview_sources = [
              (Path('bed & bunkbed.png'), assets / 'wwb-bed-bunkbed.jpg'),
              (Path('built in cabinet.png'), assets / 'wwb-built-in-cabinet.jpg'),
              (Path('camper.png'), assets / 'wwb-camper.jpg'),
              (Path('kiosk.png'), assets / 'wwb-kiosk.jpg'),
              (Path('memento 2.png'), assets / 'wwb-mementos.jpg'),
              (assets / 'racks  & shelves.png', assets / 'wwb-racks-shelves.jpg'),
              (assets / 'rental.png', assets / 'wwb-rental.jpg'),
              (assets / 'signatures.png', assets / 'wwb-signages.jpg'),
              (assets / 'table & counters.png', assets / 'wwb-tables-counters.jpg'),
              (assets / 'others.png', assets / 'wwb-other-builds.jpg'),
          ]
          for source, output in preview_sources:
              save_web_preview(source, output, max_size=(900, 900), quality=80)

          save_web_preview(assets / 'racks.png', assets / 'catalogue-poster.jpg', max_size=(1400, 1000), quality=80)
          save_web_preview(assets / 'our shared showroom.png', assets / 'showroom-web.jpg', max_size=(1600, 1200), quality=82)
          save_web_preview(assets / 'pallet.png', assets / 'pallet-web.jpg', max_size=(900, 900), quality=80)

          logo = Image.open(assets / 'logo brutti.jpg').convert('RGBA')
          bg_colour = logo.getpixel((0, 0))[:3]
          threshold = 62
          mark = Image.new('RGBA', logo.size, (255, 255, 255, 0))
          src = logo.load()
          dst = mark.load()

          for py in range(logo.height):
              for px_i in range(logo.width):
                  r, g, b, a = src[px_i, py]
                  distance = ((r-bg_colour[0])**2 + (g-bg_colour[1])**2 + (b-bg_colour[2])**2) ** 0.5
                  if distance >= threshold:
                      dst[px_i, py] = (248, 246, 239, a)

          bbox = mark.getchannel('A').getbbox()
          if bbox:
              left, top, right, bottom = bbox
              pad = 12
              left = max(0, left - pad)
              top = max(0, top - pad)
              right = min(mark.width, right + pad)
              bottom = min(mark.height, bottom + pad)
              mark = mark.crop((left, top, right, bottom))

          mark.save(assets / 'logo-brutti-white.png')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create clean page routes
        run: |
          python - <<'PY'
          from pathlib import Path

          base_path = Path('dist/index.html')
          base = base_path.read_text(encoding='utf-8')

          pages = {
              'journey': {
                  'title': 'Our Journey | Brutti™',
                  'description': 'Discover the Benua Brutti journey, from a backyard DIY idea to a growing upcycled furniture business in Sabah.',
                  'url': 'https://brutti.my/journey/',
              },
              'impact': {
                  'title': 'Impact Report | Brutti™',
                  'description': 'Explore Benua Brutti’s impact in Sabah, including recovered pallet wood, materials kept in use and the upcoming interactive impact report.',
                  'url': 'https://brutti.my/impact/',
              },
          }

          for slug, meta in pages.items():
              html = base
              html = html.replace('<title>Brutti™ (Benua Brutti Sdn Bhd)</title>', f"<title>{meta['title']}</title>")
              html = html.replace('content="Brutti by Benua Brutti Sdn Bhd creates upcycled pallet wood furniture, custom pieces and functional spaces in Sabah, Malaysia."', f"content=\"{meta['description']}\"")
              html = html.replace('<link rel="canonical" href="https://brutti.my/" />', f"<link rel=\"canonical\" href=\"{meta['url']}\" />")
              html = html.replace('<meta property="og:title" content="Brutti™ (Benua Brutti Sdn Bhd)" />', f"<meta property=\"og:title\" content=\"{meta['title']}\" />")
              html = html.replace('<meta property="og:url" content="https://brutti.my/" />', f"<meta property=\"og:url\" content=\"{meta['url']}\" />")
              html = html.replace('<meta name="twitter:title" content="Brutti™ (Benua Brutti Sdn Bhd)" />', f"<meta name=\"twitter:title\" content=\"{meta['title']}\" />")

              output = Path('dist') / slug / 'index.html'
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
