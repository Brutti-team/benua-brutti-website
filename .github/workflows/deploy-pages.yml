name: Deploy Benua Brutti website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Brutti web images
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter, ImageEnhance
          from pillow_heif import register_heif_opener

          register_heif_opener()
          assets = Path('public/assets')

          # Brutti team hero: full-width landscape composition with a text-safe left side.
          # The original group photo is kept intact on the right so every person remains visible.
          team = Image.open(assets / 'brutti team.HEIC')
          team = ImageOps.exif_transpose(team).convert('RGB')

          canvas_w, canvas_h = 2800, 1200

          # Full-bleed background from the same photo keeps the hero feeling photographic.
          bg = ImageOps.fit(
              team,
              (canvas_w, canvas_h),
              method=Image.Resampling.LANCZOS,
              centering=(0.50, 0.44),
          )
          bg = bg.filter(ImageFilter.GaussianBlur(24))
          bg = ImageEnhance.Color(bg).enhance(0.78)
          bg = ImageEnhance.Contrast(bg).enhance(0.92)
          bg = ImageEnhance.Brightness(bg).enhance(0.58).convert('RGBA')

          # Keep the full team photo sharp, including the top and bottom rows.
          foreground = team.copy()
          max_w, max_h = 1020, 1030
          scale = min(max_w / foreground.width, max_h / foreground.height)
          fg_w = max(1, int(foreground.width * scale))
          fg_h = max(1, int(foreground.height * scale))
          foreground = foreground.resize((fg_w, fg_h), Image.Resampling.LANCZOS).convert('RGBA')

          # Only feather the first narrow strip on the left edge so the photo blends into
          # the extended background without fading any team members across the image.
          fade_width = min(90, max(40, fg_w // 10))
          alpha = Image.new('L', (fg_w, fg_h), 255)
          alpha_px = alpha.load()
          for px in range(fade_width):
              value = int(255 * (px / max(1, fade_width - 1)))
              for py in range(fg_h):
                  alpha_px[px, py] = value
          foreground.putalpha(alpha)

          # Push the intact group to the right and retain generous safety margins.
          x = canvas_w - fg_w - 150
          y = (canvas_h - fg_h) // 2
          bg.alpha_composite(foreground, (x, y))

          # Dark text-safe gradient on the left. It fades out before the sharp team image.
          gradient = Image.new('L', (canvas_w, 1), 0)
          grad_px = gradient.load()
          fade_end = int(canvas_w * 0.62)
          for px in range(canvas_w):
              if px <= fade_end:
                  t = px / max(1, fade_end)
                  grad_px[px, 0] = int(178 * ((1 - t) ** 1.35))
              else:
                  grad_px[px, 0] = 0
          gradient = gradient.resize((canvas_w, canvas_h))
          overlay = Image.new('RGBA', (canvas_w, canvas_h), (5, 23, 15, 0))
          overlay.putalpha(gradient)
          bg = Image.alpha_composite(bg, overlay)

          # Small bottom wash for readable copy, without covering faces.
          bottom = Image.new('RGBA', (canvas_w, canvas_h), (0, 0, 0, 0))
          bottom_alpha = Image.new('L', (1, canvas_h), 0)
          bottom_px = bottom_alpha.load()
          start = int(canvas_h * 0.70)
          for py in range(canvas_h):
              if py >= start:
                  t = (py - start) / max(1, canvas_h - start - 1)
                  bottom_px[0, py] = int(42 * t)
          bottom.putalpha(bottom_alpha.resize((canvas_w, canvas_h)))
          bg = Image.alpha_composite(bg, bottom)

          bg.convert('RGB').save(assets / 'brutti-team-landscape.jpg', quality=93, optimize=True)

          # Browser-friendly full team fallback/mobile version.
          full_team = team.copy()
          full_team.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
          full_team.save(assets / 'brutti-team-full.jpg', quality=92, optimize=True)

          # Founder & co-founder: natural browser-friendly image.
          founders = Image.open(assets / 'founder & co founder.JPG')
          founders = ImageOps.exif_transpose(founders).convert('RGB')
          founders.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
          founders.save(assets / 'founders.jpg', quality=90, optimize=True)

          # Transparent Brutti logo.
          logo = Image.open(assets / 'logo brutti.jpg').convert('RGBA')
          bg_colour = logo.getpixel((0, 0))[:3]
          pixels = logo.load()
          threshold = 62
          for py in range(logo.height):
              for px_i in range(logo.width):
                  r, g, b, a = pixels[px_i, py]
                  distance = ((r-bg_colour[0])**2 + (g-bg_colour[1])**2 + (b-bg_colour[2])**2) ** 0.5
                  if distance < threshold:
                      pixels[px_i, py] = (r, g, b, 0)
          logo.save(assets / 'logo-brutti-transparent.png')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
