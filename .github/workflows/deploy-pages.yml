name: Deploy Benua Brutti website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Brutti web images
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener

          register_heif_opener()

          assets = Path('public/assets')

          team = Image.open(assets / 'brutti team.HEIC')
          team = ImageOps.exif_transpose(team).convert('RGB')
          team.thumbnail((2200, 2200), Image.Resampling.LANCZOS)
          team.save(assets / 'brutti-team.jpg', quality=88, optimize=True)

          logo = Image.open(assets / 'logo brutti.jpg').convert('RGBA')
          bg = logo.getpixel((0, 0))[:3]
          pixels = logo.load()
          threshold = 58
          for y in range(logo.height):
              for x in range(logo.width):
                  r, g, b, a = pixels[x, y]
                  distance = ((r-bg[0])**2 + (g-bg[1])**2 + (b-bg[2])**2) ** 0.5
                  if distance < threshold:
                      pixels[x, y] = (r, g, b, 0)
          logo.save(assets / 'logo-brutti-transparent.png')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
