name: Deploy Benua Brutti website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Brutti web images
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener

          register_heif_opener()
          assets = Path('public/assets')

          # Team hero: wide crop with the group kept central.
          team = Image.open(assets / 'brutti team.HEIC')
          team = ImageOps.exif_transpose(team).convert('RGB')
          hero = ImageOps.fit(
              team,
              (2400, 1350),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.42),
          )
          hero.save(assets / 'brutti-team-hero.jpg', quality=91, optimize=True)

          # Founder & co-founder: keep the original photo natural and clean.
          founders = Image.open(assets / 'founder & co founder.JPG')
          founders = ImageOps.exif_transpose(founders).convert('RGB')
          founders.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
          founders.save(assets / 'founders.jpg', quality=91, optimize=True)

          # Transparent Brutti logo.
          logo = Image.open(assets / 'logo brutti.jpg').convert('RGBA')
          bg_colour = logo.getpixel((0, 0))[:3]
          pixels = logo.load()
          threshold = 62
          for py in range(logo.height):
              for px_i in range(logo.width):
                  r, g, b, a = pixels[px_i, py]
                  distance = ((r-bg_colour[0])**2 + (g-bg_colour[1])**2 + (b-bg_colour[2])**2) ** 0.5
                  if distance < threshold:
                      pixels[px_i, py] = (r, g, b, 0)
          logo.save(assets / 'logo-brutti-transparent.png')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
