name: Deploy Benua Brutti website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Brutti web images
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pillow-heif
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter, ImageEnhance, ImageDraw
          from pillow_heif import register_heif_opener

          register_heif_opener()
          assets = Path('public/assets')

          # Brutti team: create a true landscape hero while keeping every person visible.
          team = Image.open(assets / 'brutti team.HEIC')
          team = ImageOps.exif_transpose(team).convert('RGB')

          canvas_w, canvas_h = 2400, 1200

          # Extended background fills the whole landscape naturally.
          bg = ImageOps.fit(
              team,
              (canvas_w, canvas_h),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.46),
          )
          bg = bg.filter(ImageFilter.GaussianBlur(28))
          bg = ImageEnhance.Color(bg).enhance(0.82)
          bg = ImageEnhance.Brightness(bg).enhance(0.58).convert('RGBA')

          # Crisp foreground keeps the complete original team composition intact.
          foreground = team.copy()
          max_w, max_h = 1060, 1140
          scale = min(max_w / foreground.width, max_h / foreground.height)
          fg_w = max(1, int(foreground.width * scale))
          fg_h = max(1, int(foreground.height * scale))
          foreground = foreground.resize((fg_w, fg_h), Image.Resampling.LANCZOS).convert('RGBA')

          # Soft feather around the foreground removes the 'portrait pasted on top' look.
          mask = Image.new('L', (fg_w, fg_h), 255)
          edge = max(28, int(min(fg_w, fg_h) * 0.045))
          feather = Image.new('L', (fg_w, fg_h), 0)
          draw = ImageDraw.Draw(feather)
          draw.rounded_rectangle((edge, edge, fg_w-edge, fg_h-edge), radius=edge*2, fill=255)
          feather = feather.filter(ImageFilter.GaussianBlur(edge))
          mask = Image.composite(mask, Image.new('L', (fg_w, fg_h), 0), feather)
          foreground.putalpha(mask)

          # Position team on the right; leave a clean area on the left for the hero copy.
          x = canvas_w - fg_w - 72
          y = (canvas_h - fg_h) // 2
          bg.alpha_composite(foreground, (x, y))

          # Gentle dark wash on the left improves text readability without hiding the image.
          overlay = Image.new('RGBA', (canvas_w, canvas_h), (0, 0, 0, 0))
          op = overlay.load()
          for px in range(canvas_w):
              strength = max(0.0, 1.0 - px / (canvas_w * 0.64))
              alpha = int(118 * (strength ** 1.5))
              for py in range(canvas_h):
                  op[px, py] = (6, 25, 17, alpha)
          bg = Image.alpha_composite(bg, overlay)
          bg.convert('RGB').save(assets / 'brutti-team-landscape.jpg', quality=92, optimize=True)

          # Keep a browser-friendly full team version for fallbacks/mobile use.
          full_team = team.copy()
          full_team.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
          full_team.save(assets / 'brutti-team-full.jpg', quality=92, optimize=True)

          # Founder & co-founder: keep the original photo natural and browser-friendly.
          founders = Image.open(assets / 'founder & co founder.JPG')
          founders = ImageOps.exif_transpose(founders).convert('RGB')
          founders.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
          founders.save(assets / 'founders.jpg', quality=90, optimize=True)

          # Transparent Brutti logo.
          logo = Image.open(assets / 'logo brutti.jpg').convert('RGBA')
          bg_colour = logo.getpixel((0, 0))[:3]
          pixels = logo.load()
          threshold = 62
          for py in range(logo.height):
              for px_i in range(logo.width):
                  r, g, b, a = pixels[px_i, py]
                  distance = ((r-bg_colour[0])**2 + (g-bg_colour[1])**2 + (b-bg_colour[2])**2) ** 0.5
                  if distance < threshold:
                      pixels[px_i, py] = (r, g, b, 0)
          logo.save(assets / 'logo-brutti-transparent.png')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
